{% extends 'core/layout.html' %}
{% load i18n %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4 shadow-lg">
      <div class="text-center mb-4">
        <img src="{% static 'core/img/app_icon_playstore_512x512.png' %}" alt="EVChargeLog Logo" style="height: 60px; width: 60px; border-radius: 14px; margin-bottom: 12px; object-fit: cover; box-shadow: 0 4px 16px rgba(0,0,0,0.5);">
        <h3 class="font-weight-bold">{% trans "Criar Conta" %}</h3>
        <p class="small mb-0" style="font-weight: 700; letter-spacing: -0.01em;"><span style="color: #84e046;">EV</span><span style="color: #f8fafc;">ChargeLog</span><span style="color: #84e046;">.com</span></p>
      </div>

      <form method="POST" action="{% url 'register' %}">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">{% trans "Registrar" %}</button>
      </form>

      <div class="text-center mt-4 border-top pt-3 border-secondary">
        <p class="text-secondary mb-0">{% trans "Já tem conta?" %} <a href="{% url 'login' %}" class="text-accent font-weight-bold">{% trans "Faça login" %}</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
