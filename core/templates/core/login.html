{% extends 'core/layout.html' %}
{% load i18n %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4 shadow-lg">
      <div class="text-center mb-4">
        <i class="fas fa-charging-station fa-3x text-accent mb-2"></i>
        <h3 class="font-weight-bold">{% trans "Acesse sua Conta" %}</h3>
        <p class="text-secondary small">EVChargeLog.com</p>
      </div>

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">{% trans "Entrar" %}</button>
      </form>

      <div class="text-center mt-4 border-top pt-3 border-secondary">
        <p class="text-secondary mb-0">{% trans "Não tem conta?" %} <a href="{% url 'register' %}" class="text-accent font-weight-bold">{% trans "Cadastre-se" %}</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
